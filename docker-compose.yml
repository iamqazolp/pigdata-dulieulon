services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pigdata
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  ingest-binance:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    command: ["--source", "binance"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy

  ingest-blockchain:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    command: ["--source", "blockchain"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy

  ingest-injector:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    command: ["--source", "injector", "--rate", "4"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
